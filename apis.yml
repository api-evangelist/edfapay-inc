aid: edfapay-inc
name: EdfaPay, Inc.
description: >-
  EdfaPay is a Saudi fintech and payment-technology company offering a
  developer-friendly payment platform across the GCC region. Its products include
  a hosted Checkout and Server-to-Server (S2S) payment gateway, SoftPOS
  tap-to-pay technology that turns mobile devices into card readers, merchant
  onboarding, payouts, e-invoicing, and white-label solutions for banks and
  partners. The gateway supports Visa, Mastercard, MADA, Apple Pay and STC Pay
  with 3D Secure, webhooks, refunds and recurring payments, on PCI-DSS certified
  infrastructure. EdfaPay was added to the API Evangelist network as a portfolio
  company of 500 Global and enriched from its public developer documentation,
  OpenAPI definitions and SDKs.
