- family: Hosted Checkout
  kind: hosted-payment-page
  description: >-
    EdfaPay-hosted, redirect-based checkout page. The merchant backend creates a
    payment session and receives a payment URL; the customer is redirected to
    the secure EdfaPay page which collects card details and handles 3D Secure
    automatically. Supports recurring payments.
  docs: https://docs.edfapay.com/docs/checkout-integration-1
- family: Embedded (Server-to-Server)
  kind: embedded-integration
  description: >-
    Merchant-owned checkout UI that captures payment details and transmits them
    server-to-server to the EdfaPay API with server-side hash authentication and
    PCI-compliant handling. Operations: SALE, STATUS, CAPTURE, REFUND, RECURRING.
  docs: https://docs.edfapay.com/docs/overview
- family: Apple Pay (Embedded)
  kind: wallet-button
  description: >-
